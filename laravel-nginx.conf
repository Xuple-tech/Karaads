server
{
    listen 80;
    listen 443 ssl http2 ;
    server_name kwatiai.com www.kwatiai.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/kwatiai.com/public;

    # SSL Configuration
    ssl_certificate    /www/server/panel/vhost/cert/kwatiai.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/kwatiai.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # PHP Configuration
    include enable-php-84.conf;

    # Laravel URL Rewriting
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files
    location ~ \.php$ {
        include enable-php-84.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Static Assets with Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Laravel Storage
    location ^~ /storage/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to sensitive files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|composer\.json|composer\.lock|artisan|phpunit\.xml)
    {
        deny all;
        return 404;
    }

    # Allow .well-known for SSL certificate verification
    location ~ /\.well-known {
        allow all;
        access_log off;
    }

    # Deny access to PHP files in sensitive directories
    location ~ ^/(vendor|storage|bootstrap)/.*\.php$ {
        deny all;
        return 404;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Logs
    access_log  /www/wwwlogs/kwatiai.com.log;
    error_log  /www/wwwlogs/kwatiai.com.error.log;
}