# ── HTTP → HTTPS redirect (308 preserves the request method, preventing POST→GET conversion) ──
server
{
    listen 80;
    server_name kwatiai.com www.kwatiai.com;

    # Allow Let's Encrypt renewal
    location ~ /\.well-known {
        allow all;
        access_log off;
    }

    # 308 keeps POST as POST (unlike 301/302 which browsers downgrade to GET)
    location / {
        return 308 https://www.kwatiai.com$request_uri;
    }
}

# ── Non-www → www canonical redirect (HTTPS only) ──
server
{
    listen 443 ssl http2;
    server_name kwatiai.com;

    ssl_certificate     /www/server/panel/vhost/cert/kwatiai.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kwatiai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 308 https://www.kwatiai.com$request_uri;
}

# ── Main HTTPS server ──
server
{
    listen 443 ssl http2;
    server_name www.kwatiai.com;
    index index.php index.html;
    root /www/wwwroot/kwatiai.com/public;

    # SSL
    ssl_certificate     /www/server/panel/vhost/cert/kwatiai.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kwatiai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Deny sensitive files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|composer\.json|composer\.lock|artisan|phpunit\.xml) {
        deny all;
        return 404;
    }

    # Deny PHP execution in sensitive directories
    location ~ ^/(vendor|storage|bootstrap)/.*\.php$ {
        deny all;
        return 404;
    }

    # Allow Let's Encrypt
    location ~ /\.well-known {
        allow all;
        access_log off;
    }

    # Static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Laravel storage
    location ^~ /storage/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE streaming endpoints — disable ALL buffering so chunks reach the client immediately
    location ~ ^/api/chat/messages(/[^/]+)?/stream$ {
        try_files $uri $uri/ /index.php?$query_string;

        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;

        # Critical for SSE: disable buffering end-to-end
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;

        # SSE headers
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Laravel URL rewriting
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include enable-php-84.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    access_log  /www/wwwlogs/kwatiai.com.log;
    error_log   /www/wwwlogs/kwatiai.com.error.log;
}
