version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-network
    command: redis-server --appendonly yes --requirepass your_secure_password_here

volumes:
  redis_data:

networks:
  laravel-network:
    driver: bridge